<style>

  #spin{position:fixed;right:18px;bottom:18px;width:14px;height:14px;border-radius:50%;background:#F0ECE4;animation:mv 1.2s linear infinite}

<script>
(function(){
  var out=document.getElementById('out');
  document.getElementById('ua').textContent=navigator.userAgent;
  var frames=0, t0=performance.now();
  function cnt(){ frames++; if(performance.now()-t0<2000) requestAnimationFrame(cnt); }
  requestAnimationFrame(cnt);
  var spin=document.getElementById('spin'), s1=getComputedStyle(spin).transform;
  var v0=document.getElementById('v');
  var p0=v0.play(); if(p0&&p0.catch)p0.catch(function(){});
  var battery='API нет';
  if(navigator.getBattery) navigator.getBattery().then(function(b){
    battery=(b.charging?'заряжается':'на батарее')+', '+Math.round(b.level*100)+'%';
  }).catch(function(){});
  setTimeout(function(){
    var fps=Math.round(frames/((performance.now()-t0)/1000));
    var s2=getComputedStyle(spin).transform;
    var cssAnim=s1!==s2;
    var v=document.getElementById('v');
    var video=!v.paused&&!v.ended&&v.readyState>=2;
    var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    function row(name,ok,text,warn){return '<div class="row"><span>'+name+'</span><b class="val '+(ok?'ok':(warn?'warn':'bad'))+'">'+text+'</b></div>';}
    out.innerHTML=
      row('Настройка «Уменьшение движения» (ОС/браузер)', !reduce, reduce?'ВКЛЮЧЕНА — это причина':'выключена')+
      row('CSS-анимации', cssAnim, cssAnim?'работают':'ЗАГЛУШЕНЫ браузером')+
      row('Автозапуск видео', video, video?'работает':'ЗАБЛОКИРОВАН')+
      row('Плавность (FPS)', fps>=45, fps+' кадр/с'+(fps<45?' — слабое железо/перегрузка':''), fps>=25&&fps<45)+
      row('Размер окна', true, innerWidth+'×'+innerHeight+' @'+(devicePixelRatio||1)+'x')+
      row('Питание', true, battery);
  }, 2600);
})();
</script>
